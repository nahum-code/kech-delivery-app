
services:
  portal:
    build:
      context: ./portal
      dockerfile: ../Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in web/.env}
    restart: unless-stopped
    ports:
      - "3000:3000"


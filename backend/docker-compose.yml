# Production stack (default).  Run:   docker compose up -d --build
# For local development, layer the dev overrides on top:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Requires a .env file (see .env.example) with SECRET_KEY, DB_*, POSTGRES_*,
# REDIS_PASSWORD, ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS, DJANGO_SUPERUSER_*.

x-django-env: &django-env
  DB_HOST: db                 # fixed compose service name — no silent fallback
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  DEBUG: ${DEBUG:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  DB_SSL_REQUIRE: ${DB_SSL_REQUIRE:-False}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}   # lets redis-cli auth without exposing the password in argv
    # Password is read from env and written to a config file at startup, so it
    # never appears in the container's process list.
    command: >
      sh -c 'printf "dir /data\nappendonly yes\nrequirepass %s\n" "$$REDIS_PASSWORD" > /tmp/redis.conf
      && exec redis-server /tmp/redis.conf'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot release job: applies migrations + bootstraps the admin, then exits.
  # Everything else waits for this to complete, so nothing depends on the web
  # container and only one process ever migrates.
  migrate:
    build: .
    # Inject the full backend/.env (CORS, Chapa, DJANGO_SUPERUSER_*, throttles).
    # The explicit `environment:` block below still overrides DB/Redis wiring.
    env_file:
      - .env
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "0"
    command: ["echo", "release tasks complete"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # Gunicorn workers default to (2 * cores) + 1; override with WEB_CONCURRENCY.
    command: >
      sh -c 'exec gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers "${WEB_CONCURRENCY:-$$(( 2 * $$(nproc) + 1 ))}" --timeout 120'
    volumes:
      - media_data:/app/media          # only user uploads mounted (no source bind in prod)
      - static_data:/app/staticfiles    # collected static, served by WhiteNoise
    ports:
      - "8000:8000"
    environment:
      <<: *django-env
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      RUN_MIGRATIONS: "0"               # handled by the migrate service
      RUN_COLLECTSTATIC: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]
    volumes:
      - media_data:/app/media
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -t 10 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  beat:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # DB-backed schedule (django-celery-beat) — no corruptible schedule file.
    # IMPORTANT: run exactly ONE beat instance — never scale this service.
    command: ["celery", "-A", "config", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    environment:
      <<: *django-env
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:

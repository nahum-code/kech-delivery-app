# Kech Delivery — reverse proxy for Django API (Gunicorn upstream).
# Copy or include from your main nginx.conf and replace TLS paths + upstream.
#
# Architecture notes (docs/architecture.md):
# - TLS termination at Nginx
# - Basic rate limit on auth paths
# - Forwarding headers for Django SECURE_PROXY_SSL_HEADER / USE_X_FORWARDED_HOST

upstream kech_django_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Adjust burst/limit to your traffic profile.
limit_req_zone $binary_remote_addr zone=kech_auth_limit:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/ssl/certs/kech-api.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/kech-api.key;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    client_max_body_size 25m;

    location /health {
        proxy_pass http://kech_django_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /ready {
        proxy_pass http://kech_django_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ~ ^/api/v1/auth/(token/|login|register/) {
        limit_req zone=kech_auth_limit burst=20 nodelay;
        proxy_pass http://kech_django_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://kech_django_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}
